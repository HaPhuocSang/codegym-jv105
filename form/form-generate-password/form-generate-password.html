<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form generate password</title>
</head>
<body>
<form>
    <div>
        <label for="lengthPassword">Độ dài password: <span id="lengthValue"></span></label>
        <input type="range" id="lengthPassword" name="lengthPassword" min="6" max="32" step="1" oninput="showValue(this.value)">
    </div>
    <div>
        <label for="number">Include number</label>
        <input type="checkbox" id="number" name="number">
    </div>
    <div>
        <label for="letter">Include letter</label>
        <input type="checkbox" id="letter" name="letter">
    </div>
    <div>
        <label for="symbol">Include Symbol</label>
        <input type="checkbox" id="symbol" name="symbol">
    </div>
    <div>
        <button type="button" onclick="showResult()">Submit</button>
    </div>
</form>
<p id="result"></p>
<script src="form-generate-password.js"></script>
</body>
</html>
