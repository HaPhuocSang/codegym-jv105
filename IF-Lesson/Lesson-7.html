<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telephone charges for a household</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<form>
    <div class="container">
        <div>
            <label for="monthly-subscription-fee">Monthly subscription fee:</label>
            <input type="number" id="monthly-subscription-fee">
        </div>
        <div>
            <label for="local-call">Local call (minutes):</label>
            <input type="number" id="local-call">
        </div>
        <div>
            <label for="mobile-call">Mobile call (minutes):</label>
            <input type="number" id="mobile-call">
        </div>
        <div>
            <button type="button" id="btnTelephoneCharges">Submit</button>
        </div>
    </div>
</form>
<p id="result"></p>
<script src="js/lesson-7.js"></script>
</body>
</html>
