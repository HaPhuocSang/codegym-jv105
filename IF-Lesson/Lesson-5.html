<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academic ranking</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<form>
    <div class="container">
        <div>
            <label for="test-score">Test score: </label>
            <input type="number" id="test-score" min="0" max="10">
        </div>
        <div>
            <label for="midterm-exam-scores">Midterm exam scores: </label>
            <input type="number" id="midterm-exam-scores" min="0" max="10">
        </div>
        <div>
            <label for="final-exam-scores">Final exam scores: </label>
            <input type="number" id="final-exam-scores" min="0" max="10">
        </div>
        <div>
            <button type="button" id="btnAcademicRanking">Submit</button>
        </div>
    </div>
</form>
<p id="result"></p>
<script src="js/lesson-5.js"></script>
</body>
</html>
