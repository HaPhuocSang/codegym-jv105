<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check eligibility for admission to grade 10.</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<form>
    <div class="container">
        <div>
            <label for="age">Age: </label>
            <input type="number" id="age" min="1" step="1">
        </div>
        <div>
            <label>Graduated from junior high school:</label>
            <input type="radio" name="graduated" checked="checked" value="Graduated"> Graduated
            <input type="radio" name="graduated" value="Not yet graduated"> Not yet graduated
        </div>
        <div>
            <button type="button" id="checkGraduate">Submit</button>
        </div>
    </div>
</form>
<p id="result"></p>
<script src="js/lesson-2.js"></script>
</body>
</html>
