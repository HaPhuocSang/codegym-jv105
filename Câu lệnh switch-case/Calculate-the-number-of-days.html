<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculate the number of days</title>
    <link rel="stylesheet" href="cal-days.css">
</head>
<body>
<form>
    <div class="container">
        <div>
            <label for="month">Month: </label>
            <input id="month" type="number" min="1" max="12">
        </div>
        <div>
            <button type="button" id="calculateDays">Submit</button>
        </div>
    </div>
</form>
<p id="result"></p>
<script src="calculate-day.js"></script>
</body>
</html>
