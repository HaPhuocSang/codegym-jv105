<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Khởi tạo một mảng số nguyên.Hiển thị giá trị lớn nhất trong mảng đó. In ra giá trị trung bình của các phần tử trong mảng.</title>
</head>
<body>
<form>
    <div>
        <label for="btnInitializeAnArray">Khởi tạo mảng số nguyên gồm 10 phần tử khác nhau: </label>
        <button type="button" onclick="pushInitializeAnArray()">Khởi tạo</button>
    </div>
    <div>
        <label for="btnGreatestValue">Hiển thị giá trị lớn nhất trong mảng : </label>
        <button type="button" onclick="showLargestElement()">Khởi tạo</button>
    </div>
    <div>
        <label for="btnAverageValue">Giá trị trung bình của các phần tử trong mảng : </label>
        <button type="button" onclick="showAverageElement()">Khởi tạo</button>
    </div>
</form>
<p id="resultFirst"></p>
<p id="resultSecond"></p>
<p id="resultThird"></p>
<script src="lesson-3.js"></script>
</body>
</html>
