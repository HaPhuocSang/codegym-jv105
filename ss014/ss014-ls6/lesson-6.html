<form>

        <label for="btnInitializeAnArray">Khởi tạo mảng số nguyên gồm 10 phần tử: </label>
        <button type="button" onclick="pushInitializeAnArray()">Khởi tạo</button>
    </div>
    <div>
        <label for="elementValue">Nhập một phần tử số nguyên muốn kiểm tra: </label>

        <button type="button" onclick="elementInspection()">Hiển thị</button>

<p id="resultLast"></p>
